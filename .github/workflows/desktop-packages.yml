name: Build cross-platform desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-port.*"

permissions:
  contents: write

jobs:
  linux-jammy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test Linux app and WSL runtime
        run: bash packaging/build_linux_docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-jammy-runtime
          path: |
            Linux/dist/IsGPTNerfed-0.5.3-linux-x86_64.tar.gz
            Linux/dist/IsGPTNerfed-0.5.3-linux-x86_64.tar.gz.sha256
            Linux/dist/nerfed-core-linux-x86_64.tar.gz
            Linux/dist/nerfed-core-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    needs: linux-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-jammy-runtime
          path: Linux/dist
      - name: Build and smoke test Windows ZIP with WSL runtime
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: |
            Windows/dist/IsGPTNerfed-0.5.3-windows-x64.zip
            Windows/dist/IsGPTNerfed-0.5.3-windows-x64.zip.sha256
          if-no-files-found: error


  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    needs: [linux-jammy, windows-native]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-jammy-runtime
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-package
          path: release/windows
      - name: Prepare versioned release assets and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          port_version="${RELEASE_TAG#v}"
          core_version="${port_version%%-port.*}"
          mv "release/linux/IsGPTNerfed-${core_version}-linux-x86_64.tar.gz" \
             "release/IsGPTNerfed-${port_version}-linux-x86_64.tar.gz"
          mv "release/windows/IsGPTNerfed-${core_version}-windows-x64.zip" \
             "release/IsGPTNerfed-${port_version}-windows-x64.zip"
          mv release/linux/nerfed-core-linux-x86_64.tar.gz release/nerfed-core-linux-x86_64.tar.gz
          mkdir release/linux-stage
          tar -C release/linux-stage -xzf "release/IsGPTNerfed-${port_version}-linux-x86_64.tar.gz"
          (cd release/linux-stage && zip -qr --symlinks "../IsGPTNerfed-${port_version}-linux-x86_64.zip" .)
          (cd release && sha256sum \
            "IsGPTNerfed-${port_version}-linux-x86_64.tar.gz" \
            "IsGPTNerfed-${port_version}-linux-x86_64.zip" \
            "IsGPTNerfed-${port_version}-windows-x64.zip" \
            nerfed-core-linux-x86_64.tar.gz > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            release/IsGPTNerfed-*-linux-x86_64.tar.gz \
            release/IsGPTNerfed-*-linux-x86_64.zip \
            release/IsGPTNerfed-*-windows-x64.zip \
            release/nerfed-core-linux-x86_64.tar.gz \
            release/SHA256SUMS.txt
