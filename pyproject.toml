[project]
name = "is-gpt-nerfed-desktop"
version = "0.5.3"
description = "Cross-platform desktop shell for is-gpt-nerfed"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
